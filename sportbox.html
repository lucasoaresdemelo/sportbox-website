<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPORTBOX</title>

    <link rel="stylesheet" href="sportbox.css">

    <!-- FONTE -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- HEADER -->
    <header class="container">
        <div class="logo">SPORTBOX</div>
        <nav>
            <a href="#">Início</a>
            <a href="#produtos">Produtos</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <!-- HERO -->
    <section class="hero">
        <h1>Vista sua paixão. Jogue com estilo</h1>
        <p>Os melhores artigos esportivos para sua evolução</p>
        <a href="#produtos" class="btn">Ver Produtos</a>
    </section>

    <!-- PRODUTOS -->
    <section id="produtos" class="produtos container">
        <h2>Produtos</h2>

        <!-- FILTROS -->
        <div class="filtros">
            <button onclick="filtrar('todos', event)" class="btn ativo">
                Todos
            </button>

            <button onclick="filtrar('copa', event)" class="btn">
                Copa do Mundo
            </button>

            <button onclick="filtrar('inter', event)" class="btn">
                Internacional
            </button>
        </div>

        <!-- GRID -->
<div class="grid"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
